version: "2"
run:
  tests: true
  timeout: 10m
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - govet
    - ineffassign
formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      rewrite-rules:
        - pattern: 'interface{}'
          replacement: 'any'
      extra:
        group-params: true
    gci:
      sections:
        - standard
        - default
        - localmodule
